[project]
name = "api-noticia"
version = "0.1.0"
description = "Datalake de notícias esportivas para previsão de bolão"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "torch>=2.2.0",
    "peft>=0.12.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.14.0",
    "matplotlib>=3.8.0",
    "lightgbm>=4.0.0",
]
gcp = [
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.16.0",
]
ner = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
orchestration = [
    "prefect>=2.19.0",
]
unsloth = [
    "unsloth",
    "datasets>=2.18.0",
    "trl>=0.12.0",
]
sofascore = [
    "curl_cffi>=0.7.0",
]
analytics = [
    "duckdb>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "curl_cffi>=0.7.0",
]

[project.scripts]
collect-news = "ingest.cli:main"
daily-sync = "ingest.daily:main"
purge-news = "ingest.purge_news:main"
import-brasileirao = "ingest.fixtures.cli:main"
import-fixtures = "ingest.fixtures.import_cli:main"
sync-gcp = "ingest.gcp.cli:main"
upload-user-csv = "ingest.user_transactions.cli:main"
watch-wallet-csv = "ingest.user_transactions.watch_cli:main"
wallet-reminder = "pipelines.wallet_reminder:main"
weekly-pl-report = "pipelines.weekly_pl_report:main"
backtest-inplay-filters = "pipelines.inplay_bet_filter_backtest:main"
sync-wc-group-results = "pipelines.sync_wc_group_results:main"
sync-wc-knockout-schedule = "pipelines.sync_wc_knockout_schedule:main"
retrain-with-feedback = "pipelines.feedback_retrain:main"
run-daily-flow = "pipelines.flows.daily:main"
enrich-gold = "pipelines.enrich_gold:main"
train-bolao = "models.train_cli:main"
import-world-cup = "ingest.fixtures.wc_cli:main"
ingest-sofascore = "ingest.sofascore.cli:main"
predict-corners = "pipelines.predict_corners:main"
predict-round = "pipelines.current_round:main"
predict-wc = "pipelines.predict_wc:main"
study-wc-model = "pipelines.wc_study:main"
value-wc-odds = "pipelines.wc_value:main"
fetch-wc-odds = "pipelines.fetch_wc_odds:main"
benchmark-wc-models = "pipelines.wc_benchmark:main"
benchmark-bolao-models = "pipelines.bolao_benchmark:main"
study-wc-calibration = "pipelines.wc_calibration:main"
train-wc = "models.wc_artifact:main"
walkforward-wc-models = "pipelines.wc_walkforward:main"
benchmark-inplay = "pipelines.inplay_benchmark:main"
inplay-daily-report = "pipelines.inplay_daily_report:main"
inplay-weekly-report = "pipelines.inplay_weekly_report:main"
benchmark-baseball-inplay = "pipelines.baseball_inplay_benchmark:main"
benchmark-league-inplay = "pipelines.league_inplay_benchmark:main"
sync-current-round = "pipelines.sync_current_round:main"
poll-superbet-live = "pipelines.poll_superbet_live:main"
regenerate-inplay-postmortem = "pipelines.inplay_postmortem:main"
validate-inplay-phase1 = "pipelines.inplay_phase1_validate:main"
build-wc-timeline = "pipelines.wc_build_timeline:main"
tune-inplay = "pipelines.wc_inplay_tune:main"
validate-inplay-phase2 = "pipelines.inplay_phase2_validate:main"
fit-inplay-hawkes = "pipelines.wc_inplay_hawkes_fit:main"
train-inplay-gbm = "pipelines.wc_inplay_gbm_train:main"
validate-inplay-phase3 = "pipelines.inplay_phase3_validate:main"
validate-inplay-phase4 = "pipelines.inplay_phase4_validate:main"
run-full-improvement = "pipelines.wc_full_improvement:main"
retrain-wc-hoje = "pipelines.retrain_wc_today:main"
retrain-all-models = "pipelines.retrain_all_models:main"
run-model-benchmark = "pipelines.model_benchmark_history:main"
backfill-mlflow = "pipelines.mlflow_registry:main"
check-inplay-ensemble = "pipelines.inplay_ensemble_readiness:main"
tune-wc-hyperparams = "pipelines.wc_tune:main"
tune-wc-kxl = "pipelines.wc_kxl_tune:main"
run-pipeline = "pipelines.cli:main"
lake-query = "pipelines.lake_query_cli:main"
mlflow-ui = "pipelines.mlflow_ui:main"
build-nextgoal-labels = "pipelines.wc_inplay_nextgoal_labels:main"
train-ensemble-stack = "pipelines.wc_ensemble_stack_train:main"
calibrate-wc-momentum = "pipelines.wc_momentum_calibrate_wc:main"
inplay-train = "pipelines.wc_inplay_train:main"
inplay-brier-benchmark = "pipelines.wc_inplay_brier_benchmark:main"
train-event-seq2seq = "pipelines.wc_event_seq2seq_train:main"
analyze-ab-test = "pipelines.wc_ab_analysis:main"
automl-thresholds = "pipelines.wc_automl_thresholds:main"
live-service = "live_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "pipelines", "schemas", "models", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: testes pesados (treino ML, benchmarks completos, carga de artefato)",
]
