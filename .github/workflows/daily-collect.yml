name: Daily News Collection

on:
  schedule:
    - cron: "0 11,17,23 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Collect and sync
        run: daily-sync

      - name: Upload lake artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lake-snapshot
          path: data/lake/
          retention-days: 30
